    <title>Terms of use · Agency Artifact</title>
    <style>

             font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

      h1 { font-size: 26px; margin: 8px 0 24px; }
      p { margin: 0 0 8px; }
      .muted { color: var(--muted); font-size: 14px; }

    </main>
  </body>
</html>
